# Render Blueprint — free web service (spins down after ~15m idle)
# Pair with a free cron ping every 10–15 min so the scanner stays alive:
#   https://cron-job.org → GET/POST https://YOUR-APP.onrender.com/api/uti/scan/run
services:
  - type: web
    name: uti-trading-intel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: UTI_LLM_PROVIDER
        value: groq
      - key: UTI_QUICK_MODEL
        value: llama-3.1-8b-instant
      - key: UTI_DEEP_MODEL
        value: llama-3.3-70b-versatile
      - key: UTI_SCANNER_ENABLED
        value: "true"
      - key: UTI_SCAN_SYMBOLS
        value: XAUUSD,XAGUSD,NAS100,US30,SPX500,USOIL
      - key: UTI_SCAN_TIMEFRAME
        value: "30"
      - key: UTI_SCAN_INTERVAL_SECONDS
        value: "900"
      - key: UTI_SIGNAL_MIN_QUALITY
        value: "60"
      - key: UTI_SIGNAL_MIN_CONFIDENCE
        value: "65"
      - key: UTI_PAPER_ONLY
        value: "true"
      - key: UTI_PAPER_STARTING_CASH
        value: "100"
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WORLDMONITOR_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
