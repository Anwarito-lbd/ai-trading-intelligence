# Render Blueprint — free web service (spins down after ~15m idle)
# TV→Telegram: /api/webhooks/tv-telegram?secret=...
# Pair with a free cron ping every 10–15 min so the scanner stays alive:
#   https://cron-job.org → GET/POST https://YOUR-APP.onrender.com/api/uti/scan/run
services:
  - type: web
    name: uti-trading-intel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: UTI_LLM_PROVIDER
        value: auto
      - key: UTI_QUICK_MODEL
        value: llama-3.1-8b-instant
      - key: UTI_DEEP_MODEL
        value: llama-3.1-8b-instant
      - key: UTI_SCANNER_ENABLED
        value: "true"
      - key: UTI_SCAN_SYMBOLS
        value: XAUUSD
      - key: UTI_SCAN_TIMEFRAME
        value: "30"
      - key: UTI_SCAN_INTERVAL_SECONDS
        value: "900"
      - key: UTI_SIGNAL_MIN_QUALITY
        value: "60"
      - key: UTI_SIGNAL_MIN_CONFIDENCE
        value: "65"
      - key: UTI_PAPER_ONLY
        value: "true"
      - key: UTI_PAPER_STARTING_CASH
        value: "100"
      - key: TRADINGAGENTS_ENABLED
        value: "true"
      - key: TRADINGAGENTS_FULL_GRAPH
        value: "true"
      - key: UTI_TA_ANALYSTS
        value: market,news
      - key: UTI_MAX_DEBATE_ROUNDS
        value: "1"
      - key: UTI_TA_CACHE_SECONDS
        value: "1200"
      - key: UTI_TA_PREFER_COMPACT
        value: "true"
      - key: KRONOS_ENABLED
        value: "true"
      - key: KRONOS_MODEL
        value: NeoQuasar/Kronos-mini
      - key: KRONOS_TOKENIZER
        value: NeoQuasar/Kronos-Tokenizer-2k
      - key: KRONOS_DEVICE
        value: cpu
      - key: MIROFISH_ENABLED
        value: "true"
      - key: UTI_AUTO_DECIDE_ON_WEBHOOK
        value: "false"
      - key: UTI_GEMINI_SEARCH_GROUNDING
        value: "true"
      - key: UTI_SCAN_GROUNDING
        value: "false"
      - key: UTI_TV_REFRESH_AI
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WORLDMONITOR_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
